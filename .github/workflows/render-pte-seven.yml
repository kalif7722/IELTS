name: Render PTE Seven Slides — Andrew US
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'inputs/PTE-Read-Aloud-7-Slides.mp4'
      - 'examples/pte-read-aloud-seven-scenes.json'
      - 'render_pte_seven.py'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Andrew US engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts
      - name: Render original PTE video with Andrew US voice
        run: python render_pte_seven.py
      - name: Publish MP4 and slide timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PTE-Seven-Slides-Andrew-US-Reel
          path: |
            dist/PTE-Read-Aloud-Andrew-US.mp4
            dist/pte-seven-render-manifest.json
          if-no-files-found: warn
          retention-days: 30
